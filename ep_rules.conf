# EP Rules Configuration
# Format:
# [extension]
# keywords=kw1,kw2,kw3
# operators=op1,op2
# line_comment=prefix
# block_start=/*
# block_end=*/
# quotes="'
# shebang=pattern (e.g. python)

[.py]
keywords=def,class,if,elif,else,return,import,from,for,while,try,except,with,as,pass,break,continue
line_comment=#
quotes="'
positional=1
shebang=python

[.c]
keywords=int,char,void,if,else,return,include,struct,typedef,for,while,switch,case,break,continue,static,extern
line_comment=//
block_start=/*
block_end=*/
quotes="'

[.h]
keywords=int,char,void,if,else,return,include,struct,typedef,for,while,switch,case,break,continue,static,extern,define,ifdef,ifndef,endif
line_comment=//
block_start=/*
block_end=*/
quotes="'

[.js]
keywords=function,const,let,var,if,else,return,for,while,switch,case,break,continue,import,export,from,async,await,try,catch
line_comment=//
block_start=/*
block_end=*/
quotes="'`

[.rexx]
keywords=address,arg,call,do,drop,else,end,exit,if,interpret,iterate,leave,nop,numeric,options,otherwise,parse,procedure,pull,push,queue,return,say,select,signal,then,trace,upper
line_comment=--
quotes="'
shebang=rexx

[.md]
operators=#,*,_,-,[,],(,),!,`,>,+,=
line_comment=
quotes=
